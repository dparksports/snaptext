[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "snaptext"
version = "0.2.0"
description = "Photos, scans, screenshots and PDFs to shareable text - local OCR pipeline for Windows, macOS and Linux"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "pyperclip>=1.8",
    "pypdf>=4.0",
    "pymupdf>=1.24",
    "rapidocr-onnxruntime>=1.2.3",
    "mss>=9.0",
]

[project.optional-dependencies]
hotkey = ["keyboard>=0.13.4"]

[project.scripts]
snaptext = "snaptext.cli:main"

[tool.setuptools]
packages = ["snaptext"]
